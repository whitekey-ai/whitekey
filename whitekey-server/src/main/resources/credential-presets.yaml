app:
  credentials:
    presets:
      - id: github
        display-name: GitHub
        default-host: api.github.com
        target-type: HEADER
        target-key: Authorization
        format-template: "Bearer %s"
        description: "GitHub Personal Access Token or App Token"

      - id: stripe
        display-name: Stripe
        default-host: api.stripe.com
        target-type: HEADER
        target-key: Authorization
        format-template: "Bearer %s"
        description: "Stripe Secret Key (sk_live_...)"

      - id: slack
        display-name: Slack
        default-host: slack.com
        target-type: HEADER
        target-key: Authorization
        format-template: "Bearer %s"
        description: "Slack Bot or User OAuth Token (xoxb-...)"

      - id: openai
        display-name: OpenAI
        default-host: api.openai.com
        target-type: HEADER
        target-key: Authorization
        format-template: "Bearer %s"
        description: "OpenAI API Key (sk-...)"

      - id: anthropic
        display-name: Anthropic
        default-host: api.anthropic.com
        target-type: HEADER
        target-key: x-api-key
        format-template: "%s"
        description: "Anthropic API Key (sk-ant-...)"
