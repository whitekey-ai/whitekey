app:
  credentials:
    presets:
      - id: github
        display-name: GitHub
        description: "GitHub Personal Access Token or App Token (Git + API)"
        injections:
          - host: github.com
            injection-target: HEADER
            key: Authorization
            format: "Basic base64(x-access-token:%s)"
          - host: api.github.com
            injection-target: HEADER
            key: Authorization
            format: "Bearer %s"
